name: Check Latest NPM Version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Create .npmrc for npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

      - name: Show latest published version of @axeptio/react-native-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_READONLY }}
        run: |
          echo "🔍 Fetching latest version..."
          npm show @axeptio/react-native-sdk@latest version --registry https://registry.npmjs.org/
