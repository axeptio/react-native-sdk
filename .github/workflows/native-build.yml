name: Native Build

on:
  pull_request:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: example-expo/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install example dependencies
        working-directory: example-expo
        run: npm ci

      - name: Generate android project
        working-directory: example-expo
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: example-expo/android
        env:
          # The Axeptio Android SDK resolves from GitHub Packages; GITHUB_ACTOR
          # is a default env var, the token is not.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew assembleDebug --no-daemon

  ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: example-expo/package-lock.json

      - name: Install example dependencies
        working-directory: example-expo
        run: npm ci

      - name: Generate ios project
        working-directory: example-expo
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: example-expo/ios
        run: pod install

      - name: Build for iOS simulator
        working-directory: example-expo/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace AxeptioSdkExample.xcworkspace \
            -scheme AxeptioSdkExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions
